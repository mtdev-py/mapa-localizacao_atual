<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoTracker - Sua Localizacao em Tempo Real</title>
  <meta name="description" content="Encontre sua localizacao atual com GPS de alta precisao e fallback por IP. Interface moderna com mapa interativo.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2128;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --radius: 12px;
    }

    html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); }

    body { display: flex; flex-direction: column; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #a371f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header h1 span { color: var(--accent); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      animation: pulse 2s infinite;
    }

    .status-badge.active .status-dot { background: var(--success); }
    .status-badge.error .status-dot { background: var(--error); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Map */
    .map-container { flex: 1; position: relative; }
    #map { height: 100%; width: 100%; }

    /* Info Panel */
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 420px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      z-index: 1000;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(120%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .info-panel.visible { transform: translateY(0); }

    .info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .info-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .method-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .method-badge.gps { background: rgba(63, 185, 80, 0.15); color: var(--success); }
    .method-badge.ip { background: rgba(210, 153, 34, 0.15); color: var(--warning); }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .info-item {
      padding: 12px 16px;
      background: var(--bg-secondary);
    }

    .info-item.full { grid-column: 1 / -1; }

    .info-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .info-value.accent { color: var(--accent); }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 2000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Accuracy circle */
    .accuracy-ring {
      border: 2px solid var(--accent);
      background: var(--accent-glow);
    }

    /* Dark tiles */
    .leaflet-tile-pane { filter: brightness(0.7) contrast(1.1) saturate(0.9); }
    .leaflet-control-attribution { background: var(--bg-secondary) !important; color: var(--text-secondary) !important; font-size: 10px !important; border-radius: 6px 0 0 0 !important; border: 1px solid var(--border) !important; }
    .leaflet-control-attribution a { color: var(--accent) !important; }
    .leaflet-control-zoom { border: 1px solid var(--border) !important; border-radius: 8px !important; overflow: hidden; }
    .leaflet-control-zoom a { background: var(--bg-secondary) !important; color: var(--text-primary) !important; border-color: var(--border) !important; width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 16px !important; }
    .leaflet-control-zoom a:hover { background: var(--bg-card) !important; }

    /* Responsive */
    @media (max-width: 480px) {
      .info-panel { left: 10px; right: 10px; bottom: 10px; }
      .header h1 { font-size: 14px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo">&#x1F30D;</div>
      <h1>Geo<span>Tracker</span></h1>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">Localizando...</span>
    </div>
  </header>

  <div class="map-container">
    <div id="map"></div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Solicitando permissao de localizacao...</div>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="info-header">
        <h2>Dados da Localizacao</h2>
        <span class="method-badge" id="methodBadge">--</span>
      </div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Latitude</div>
          <div class="info-value accent" id="lat">--</div>
        </div>
        <div class="info-item">
          <div class="info-label">Longitude</div>
          <div class="info-value accent" id="lon">--</div>
        </div>
        <div class="info-item">
          <div class="info-label">Precisao</div>
          <div class="info-value" id="accuracy">--</div>
        </div>
        <div class="info-item">
          <div class="info-label">Metodo</div>
          <div class="info-value" id="method">--</div>
        </div>
        <div class="info-item full">
          <div class="info-label">Endereco Aproximado</div>
          <div class="info-value" id="address">Buscando...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize map with dark style centered on Brazil
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    }).setView([-14.2350, -51.9253], 4);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/copyright">OSM</a>'
    }).addTo(map);

    const elements = {
      loading: document.getElementById('loadingOverlay'),
      loadingText: document.getElementById('loadingText'),
      panel: document.getElementById('infoPanel'),
      status: document.getElementById('statusBadge'),
      statusText: document.getElementById('statusText'),
      method: document.getElementById('methodBadge'),
      lat: document.getElementById('lat'),
      lon: document.getElementById('lon'),
      accuracy: document.getElementById('accuracy'),
      methodText: document.getElementById('method'),
      address: document.getElementById('address')
    };

    let marker = null;
    let accuracyCircle = null;

    function showLocation(lat, lon, acc, methodType) {
      // Update map
      map.setView([lat, lon], methodType === 'gps' ? 16 : 12);

      // Custom marker
      const icon = L.divIcon({
        html: `<div style="
          width: 18px; height: 18px;
          background: #58a6ff;
          border: 3px solid #fff;
          border-radius: 50%;
          box-shadow: 0 0 12px rgba(88,166,255,0.6);
        "></div>`,
        className: '',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });

      if (marker) map.removeLayer(marker);
      if (accuracyCircle) map.removeLayer(accuracyCircle);

      marker = L.marker([lat, lon], { icon }).addTo(map);

      if (acc && methodType === 'gps') {
        accuracyCircle = L.circle([lat, lon], {
          radius: acc,
          color: '#58a6ff',
          fillColor: 'rgba(88,166,255,0.1)',
          fillOpacity: 0.3,
          weight: 1.5
        }).addTo(map);
      }

      // Update panel
      elements.lat.textContent = lat.toFixed(6);
      elements.lon.textContent = lon.toFixed(6);
      elements.accuracy.textContent = acc ? `${Math.round(acc)}m` : 'N/A';

      if (methodType === 'gps') {
        elements.methodText.textContent = 'GPS (Alta Precisao)';
        elements.method.textContent = 'GPS';
        elements.method.className = 'method-badge gps';
        elements.status.className = 'status-badge active';
        elements.statusText.textContent = 'Localizado via GPS';
      } else {
        elements.methodText.textContent = 'IP (Aproximado)';
        elements.method.textContent = 'IP';
        elements.method.className = 'method-badge ip';
        elements.status.className = 'status-badge active';
        elements.statusText.textContent = 'Localizado via IP';
      }

      // Reverse geocoding
      reverseGeocode(lat, lon);

      // Show panel
      elements.loading.classList.add('hidden');
      setTimeout(() => elements.panel.classList.add('visible'), 300);
    }

    async function reverseGeocode(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=pt-br`);
        const data = await res.json();
        if (data.display_name) {
          // Shorten address
          const parts = data.display_name.split(', ');
          elements.address.textContent = parts.slice(0, 4).join(', ');
        }
      } catch {
        elements.address.textContent = 'Indisponivel';
      }
    }

    async function fallbackIP() {
      elements.loadingText.textContent = 'GPS negado. Tentando localizacao por IP...';
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data.latitude && data.longitude) {
          showLocation(data.latitude, data.longitude, null, 'ip');
        } else {
          showError('Nao foi possivel determinar a localizacao.');
        }
      } catch {
        // Try backup API
        try {
          const res = await fetch('https://ip-api.com/json/?fields=lat,lon');
          const data = await res.json();
          if (data.lat && data.lon) {
            showLocation(data.lat, data.lon, null, 'ip');
          } else {
            showError('Nao foi possivel determinar a localizacao.');
          }
        } catch {
          showError('Falha ao obter localizacao. Verifique sua conexao.');
        }
      }
    }

    function showError(msg) {
      elements.loading.classList.add('hidden');
      elements.status.className = 'status-badge error';
      elements.statusText.textContent = 'Erro';
      alert(msg);
    }

    // GPS success
    function onGPSSuccess(position) {
      const { latitude, longitude, accuracy } = position.coords;
      showLocation(latitude, longitude, accuracy, 'gps');
    }

    // GPS error -> fallback to IP
    function onGPSError(err) {
      console.warn('GPS error:', err.message);
      fallbackIP();
    }

    // Start
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(onGPSSuccess, onGPSError, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    } else {
      fallbackIP();
    }
  </script>
</body>
</html>
