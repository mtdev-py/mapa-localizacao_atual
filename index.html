<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localização Atual</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <script>
    // Cria o mapa centralizado no Brasil
    var map = L.map('map').setView([-14.2350, -51.9253], 4);

    // Adiciona o mapa base (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Função de sucesso ao pegar a localização
    function success(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      // Centraliza o mapa na posição do usuário
      map.setView([lat, lon], 15);

      // Adiciona marcador na posição do usuário
      L.marker([lat, lon]).addTo(map)
        .bindPopup('📍 Sua localização atual')
        .openPopup();
    }

    // Função de erro
    function error(err) {
      alert("Não foi possível obter a localização: " + err.message);
    }

    // Solicita a localização do usuário
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(success, error);
    } else {
      alert("Seu navegador não suporta geolocalização.");
    }
  </script>
</body>
</html>
